services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.4
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: "1"
      N8N_DEFAULT_LOCALE: zh
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    volumes:
      - "${N8N_DATA_DIR:-./.n8n}:/home/node/.n8n"
      - "${MEDICAL_CORPUS_DIR:-./medical_corpus}:/files/medical_corpus:ro"

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - "${POSTGRES_DATA_DIR:-./.postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
